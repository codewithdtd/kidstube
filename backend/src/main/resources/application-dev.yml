spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kidstube}
    username: ${DATABASE_USERNAME:kidstube_user}
    password: ${DATABASE_PASSWORD:kidstube_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: KidsTubeHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      keepalive-time: 60000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
