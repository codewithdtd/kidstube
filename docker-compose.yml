version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kidstube_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kidstube}
      POSTGRES_USER: ${POSTGRES_USER:-kidstube_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kidstube_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kidstube_user} -d ${POSTGRES_DB:-kidstube}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
